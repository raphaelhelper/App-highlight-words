name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o WordPopupOverlay-GitHub-flat.zip -d extracted

          cp -r extracted/. .

          rm -rf extracted
          rm WordPopupOverlay-GitHub-flat.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Extract Android project" || echo "Nothing to commit"

          git push
